[RosterLoader]
; roster file in your Saves folder, loaded at boot (empty = off)
AutoLoad=KMTS2K 26v7 EX.ROS
; ms after the menus start (0 = right away)
Delay=0
; 1 = no "Loading Roster" box (its Enter is pressed for you; if the game is not in front, the box is shown), 0 = the game's box
HidePopup=1
; 1 = frames not drawn while loading (fastest), 0 = black frames
Fast=1
; the game clock runs this many times faster while loading (1 = off)
Warp=8
; 1 = the title page's "2K Sports server is temporarily unavailable" box is not shown (the servers are gone), 0 = shown
HideServerMessage=1
; Play Now default teams, by team ID (the number in the team's logo file: logo014.iff = 14).
; Known: Heat 10, Knicks 14, Spurs 25. Game default: DefaultHome=10, DefaultAway=25 (both = game's own default, nothing changed)
DefaultHome=14
DefaultAway=25
